<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>To-Do List</title>
  <link rel="stylesheet" href="dist/css/main.css">
  <script src="js/main.js" defer></script>
</head>
<body class="bg-slate-50 font-sans leading-normal text-slate-900">
  <main class="mx-auto max-w-2xl px-4 pt-6 pb-16">
    <h1 class="text-3xl leading-tight font-bold sm:text-4xl">Мои задачи</h1>

    <div class="my-6 flex flex-col gap-3 sm:flex-row">
      <div class="flex-1">
        <label class="sr-only" for="search">Поиск задач</label>
        <input id="search" class="js-search min-h-11 w-full rounded-xl border border-slate-500 bg-white px-3.5 py-2 text-slate-900 placeholder:text-slate-600 focus-visible:outline-3 focus-visible:outline-offset-2 focus-visible:outline-indigo-700" type="search" placeholder="Найти задачу…" autocomplete="off">
      </div>
      <button type="button" class="js-add-task min-h-11 cursor-pointer rounded-xl px-5 py-2 font-semibold focus-visible:outline-3 focus-visible:outline-offset-2 focus-visible:outline-indigo-700 border border-indigo-700 bg-indigo-700 text-white hover:bg-indigo-800">Добавить задачу</button>
    </div>

    <p class="sr-only js-status" role="status"></p>
    <ul class="js-task-list grid gap-2"></ul>
    <p class="js-empty px-4 py-8 text-center text-slate-600" hidden></p>
  </main>

  <dialog class="js-task-dialog m-auto w-[min(28rem,calc(100%-2rem))] rounded-xl border border-slate-500 bg-white p-0 text-slate-900 backdrop:bg-black/60" aria-labelledby="task-dialog-title">
    <form class="js-task-form grid gap-3 p-6" method="dialog" novalidate>
      <h2 class="js-dialog-title text-xl font-bold" id="task-dialog-title">Новая задача</h2>
      <label class="font-semibold" for="task-title">Название</label>
      <input class="js-task-input min-h-11 w-full rounded-xl border border-slate-500 bg-white px-3.5 py-2 text-slate-900 placeholder:text-slate-600 focus-visible:outline-3 focus-visible:outline-offset-2 focus-visible:outline-indigo-700 aria-invalid:border-red-700" id="task-title" name="title" type="text" required autofocus autocomplete="off" aria-describedby="task-error">
      <p class="js-form-error text-red-700" id="task-error" role="alert" hidden>Введите название задачи.</p>
      <div class="mt-2 flex flex-wrap justify-end gap-2">
        <button type="button" class="js-close-dialog min-h-11 cursor-pointer rounded-xl px-5 py-2 font-semibold focus-visible:outline-3 focus-visible:outline-offset-2 focus-visible:outline-indigo-700 border border-slate-500 bg-white hover:bg-slate-100">Отмена</button>
        <button type="submit" class="min-h-11 cursor-pointer rounded-xl px-5 py-2 font-semibold focus-visible:outline-3 focus-visible:outline-offset-2 focus-visible:outline-indigo-700 border border-indigo-700 bg-indigo-700 text-white hover:bg-indigo-800">Сохранить</button>
      </div>
    </form>
  </dialog>

  <template class="js-task-template">
    <li class="group flex items-center gap-3 rounded-xl border border-slate-200 bg-white py-1 pr-2 pl-4" data-task data-done="false">
      <input class="js-toggle size-5.5 shrink-0 cursor-pointer accent-indigo-700 focus-visible:outline-3 focus-visible:outline-offset-2 focus-visible:outline-indigo-700" type="checkbox">
      <label class="js-title min-w-0 flex-1 cursor-pointer py-2 wrap-anywhere group-data-[done=true]:text-slate-600 group-data-[done=true]:line-through"></label>
      <button type="button" class="js-edit grid size-11 shrink-0 cursor-pointer place-items-center rounded-full text-slate-900 hover:bg-slate-100 focus-visible:outline-3 focus-visible:outline-offset-2 focus-visible:outline-indigo-700">
        <span class="sr-only">Редактировать задачу</span>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
      </button>
      <button type="button" class="js-delete grid size-11 shrink-0 cursor-pointer place-items-center rounded-full text-red-700 hover:bg-red-50 focus-visible:outline-3 focus-visible:outline-offset-2 focus-visible:outline-indigo-700">
        <span class="sr-only">Удалить задачу</span>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
      </button>
    </li>
  </template>
</body>
</html>
