<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>To-Do List</title>
  <script>try{var t=localStorage.getItem('todo.theme');if(t==='dark'||t==='light')document.documentElement.dataset.theme=t}catch(e){}</script>
  <link rel="stylesheet" href="dist/css/main.css">
  <script src="js/main.js" defer></script>
</head>
<body>
  <main class="app">
    <header class="app__header">
      <h1 class="app__title">Мои задачи</h1>
      <button type="button" class="theme-switcher js-theme-toggle" aria-pressed="false">
        <span class="visually-hidden">Тёмная тема</span>
        <svg class="theme-switcher__icon theme-switcher__icon--moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <svg class="theme-switcher__icon theme-switcher__icon--sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
      </button>
    </header>

    <div class="toolbar">
      <div class="search">
        <label class="visually-hidden" for="search">Поиск задач</label>
        <input id="search" class="search__input js-search" type="search" placeholder="Найти задачу…" autocomplete="off">
      </div>
      <button type="button" class="button button--primary js-add-task">Добавить задачу</button>
    </div>

    <p class="visually-hidden js-status" role="status"></p>
    <ul class="task-list js-task-list"></ul>
    <p class="empty js-empty" hidden></p>
  </main>

  <dialog class="modal js-task-dialog" aria-labelledby="task-dialog-title">
    <form class="modal__form js-task-form" method="dialog" novalidate>
      <h2 class="modal__title js-dialog-title" id="task-dialog-title">Новая задача</h2>
      <label class="modal__label" for="task-title">Название</label>
      <input class="modal__input js-task-input" id="task-title" name="title" type="text" required autofocus autocomplete="off" aria-describedby="task-error">
      <p class="modal__error js-form-error" id="task-error" role="alert" hidden>Введите название задачи.</p>
      <div class="modal__actions">
        <button type="button" class="button js-close-dialog">Отмена</button>
        <button type="submit" class="button button--primary">Сохранить</button>
      </div>
    </form>
  </dialog>

  <template class="js-task-template">
    <li class="task" data-task data-done="false">
      <input class="task__check js-toggle" type="checkbox">
      <label class="task__title js-title"></label>
      <button type="button" class="task__btn js-edit">
        <span class="visually-hidden">Редактировать задачу</span>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
      </button>
      <button type="button" class="task__btn task__btn--danger js-delete">
        <span class="visually-hidden">Удалить задачу</span>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
      </button>
    </li>
  </template>
</body>
</html>
